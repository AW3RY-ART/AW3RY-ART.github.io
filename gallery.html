  <style>
    :root {
      --gallery-gap: clamp(0.75rem, 1.5vw, 1.1rem);
    }

    body {
      background: #0c0d0f;
      color: #f3f2ef;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .gallery-shell {
      width: 100%;
      height: 100%;
      margin: 0 auto;
      padding: 0;
      background: transparent;
      position: relative;
      z-index: 0;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    .gallery-shell main {
      width: min(100%, 1220px);
      height: 100%;
      margin: 0 auto;
      padding-left: clamp(1rem, 2vw, 2rem);
      padding-right: clamp(1rem, 2vw, 2rem);
    }

    .gallery-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem 0 2.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: clamp(2rem, 5vw, 4rem);
    }

    .gallery-brand {
      color: #f4f1eb;
      font-family: 'Atavian', Arial, sans-serif;
      font-size: clamp(1.5rem, 2vw, 2rem);
      letter-spacing: -.05em;
    }

    .gallery-nav {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(244, 241, 235, 0.78);
    }

    .gallery-nav a {
      transition: opacity 180ms ease, color 180ms ease;
      color: rgba(244, 241, 235, 0.78);
    }

    .gallery-nav a:hover {
      opacity: 1;
      color: #fff;
    }

    .gallery-hero {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 100svh;
      display: block;
      margin: 0;
      overflow: hidden;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      background: #0c0d0f;
      text-align: center;
    }

    .gallery-hero .hero-liquid-bg {
      z-index: 1;
      transition: filter 1.2s cubic-bezier(.16, 1, .3, 1);
    }

    .gallery-hero.is-cars-palette .hero-liquid-bg {
      filter: hue-rotate(125deg) saturate(1.08);
    }

    .gallery-hero.is-fanarts-palette .hero-liquid-bg {
      filter: hue-rotate(-105deg) saturate(1.08);
    }

    .gallery-hero > .gallery-infinite-grid {
      position: absolute;
      z-index: 3;
      inset: 0;
      overflow: hidden;
      background-color: rgba(5, 5, 5, .24);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 1.2s cubic-bezier(.16, 1, .3, 1), visibility 0s linear 1.2s, background-color 520ms ease;
    }

    .gallery-hero.is-grid-background > .gallery-infinite-grid {
      background-color: #fff;
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .gallery-infinite-grid.is-dragging {
      cursor: grabbing;
    }

    .gallery-grid-track {
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(3, max-content);
      grid-template-rows: repeat(3, max-content);
      transform-origin: top left;
    }

    .gallery-grid-track.is-centering {
      transition: transform 620ms cubic-bezier(.16, 1, .3, 1);
      will-change: transform;
    }

    .gallery-infinite-grid.is-dragging .gallery-grid-track {
      will-change: transform;
    }

    .gallery-grid-reel {
      display: grid;
      --gallery-grid-tile-size: clamp(112px, 14vw, 190px);
      --gallery-grid-gap: clamp(1rem, 2.4vw, 2rem);
      grid-template-columns: repeat(6, var(--gallery-grid-tile-size));
      grid-auto-rows: var(--gallery-grid-tile-size);
      gap: var(--gallery-grid-gap);
      padding: 0 var(--gallery-grid-gap) var(--gallery-grid-gap) 0;
    }

    .gallery-grid-tile {
      display: grid;
      position: relative;
      z-index: 0;
      box-sizing: border-box;
      width: var(--gallery-grid-tile-size);
      height: var(--gallery-grid-tile-size);
      place-items: center;
      overflow: hidden;
      background: transparent;
      aspect-ratio: 1;
      transition: transform 420ms cubic-bezier(.16, 1, .3, 1), opacity 300ms ease;
    }

    .gallery-infinite-grid.has-focused-tile .gallery-grid-tile:not(.is-focused) {
      opacity: .48;
    }

    .gallery-grid-tile.is-focused {
      z-index: 2;
      transform: scale(1.55);
    }

    .gallery-focus-meta {
      position: absolute;
      z-index: 4;
      inset: 0;
      color: #171717;
      opacity: 0;
      visibility: hidden;
      transform: translateX(18px);
      pointer-events: none;
      transition: opacity 480ms ease, transform 620ms cubic-bezier(.16, 1, .3, 1), visibility 0s linear 480ms;
    }

    .gallery-focus-meta.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
      transition-delay: 0s;
    }

    .gallery-focus-brand {
      position: absolute;
      top: clamp(2.5rem, 7vh, 5rem);
      left: 50%;
      transform: translateX(-50%);
      color: inherit;
      font-family: 'Ashing', 'Brush Script MT', cursive;
      font-size: clamp(2rem, 3.2vw, 3rem);
      line-height: .9;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .gallery-focus-caption {
      position: absolute;
      top: 50%;
      right: clamp(2rem, 7vw, 7rem);
      width: min(30vw, 360px);
      margin: 0;
      padding: 0;
      text-align: left;
      transform: translateY(-50%);
    }

    .gallery-focus-eyebrow {
      margin: 0 0 .75rem;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(23,23,23,.56);
    }

    .gallery-focus-event {
      margin: 0;
      font-family: 'Atavian', Arial, sans-serif;
      font-size: clamp(2rem, 4vw, 4rem);
      font-weight: 400;
      line-height: .9;
      letter-spacing: -.055em;
      text-transform: uppercase;
    }

    .gallery-focus-image {
      margin: 1rem 0 0;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(23,23,23,.62);
    }

    .gallery-focus-filename {
      margin: .45rem 0 0;
      font-family: Arial, sans-serif;
      font-size: 9px;
      color: rgba(23,23,23,.48);
    }

    .gallery-hero > .gallery-infinite-grid.has-focused-tile {
      background-color: #fff;
    }

    .gallery-grid-tile img {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      object-position: center;
      pointer-events: none;
      user-select: none;
    }

    .gallery-hero.is-grid-background > .gallery-infinite-grid {
      opacity: 1;
      visibility: visible;
      transition-delay: 0s;
    }

    .gallery-hero-copy,
    .gallery-hero .media-controls,
    .gallery-hero > .sound-button {
      transition: opacity 600ms ease, visibility 0s linear;
    }

    .gallery-hero.is-grid-background .gallery-hero-copy,
    .gallery-hero.is-grid-background .media-controls,
    .gallery-hero.is-grid-background > .sound-button {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition-delay: 0s, 600ms;
    }

    .site-header {
      transition: background-color 760ms cubic-bezier(.16, 1, .3, 1),
        color 760ms cubic-bezier(.16, 1, .3, 1),
        box-shadow 760ms cubic-bezier(.16, 1, .3, 1),
        backdrop-filter 760ms cubic-bezier(.16, 1, .3, 1),
        border-color 760ms cubic-bezier(.16, 1, .3, 1),
        opacity 600ms ease,
        transform 600ms ease,
        visibility 0s linear;
    }

    html.gallery-grid-background .site-header {
      opacity: 0;
      transform: translateY(-14px);
      visibility: hidden;
      pointer-events: none;
      animation: none;
      transition-delay: 0s, 0s, 0s, 0s, 0s, 0s, 0s, 600ms;
    }

    html.gallery-grid-background .site-nav {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .gallery-hero .hero-liquid-bg,
      .gallery-hero > .gallery-infinite-grid,
      .gallery-focus-meta,
      .gallery-hero-copy,
      .gallery-hero .media-controls,
      .gallery-hero > .sound-button,
      .site-header,
      .gallery-grid-tile,
      .gallery-grid-track.is-centering {
        transition: none;
      }

      .gallery-panel--showcase::before,
      .gallery-panel--showcase::after {
        animation: none;
        opacity: 0;
      }

      .gallery-panel--contact[open] {
        animation: none;
      }
    }

    @media (max-width: 680px) {
      .gallery-grid-reel {
        --gallery-grid-tile-size: clamp(84px, 21vw, 120px);
        --gallery-grid-gap: clamp(.75rem, 3vw, 1.1rem);
        grid-template-columns: repeat(4, var(--gallery-grid-tile-size));
      }

      .gallery-focus-meta {
        inset: 0;
      }

      .gallery-focus-caption {
        right: 1rem;
        width: 35vw;
      }

      .gallery-focus-brand {
        font-size: clamp(1.5rem, 6vw, 2rem);
      }

      .gallery-focus-event {
        font-size: clamp(1.25rem, 5vw, 2rem);
      }
    }

    .gallery-hero-copy {
      position: absolute;
      z-index: 10;
      top: 50%;
      left: 50%;
      width: min(90vw, 700px);
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .gallery-kicker {
      margin: 0 0 0.7rem;
    }

    .gallery-bottom-nav {
      position: fixed;
      z-index: 1001;
      bottom: clamp(36px, 5vh, 58px);
      left: 50%;
      display: flex;
      justify-content: center;
      width: min(260px, calc(100vw - 48px));
      transform: translateX(-50%);
    }

    .gallery-bottom-nav a {
      position: relative;
      display: block;
      width: 100%;
      margin: 0 auto;
      padding: 10px 10px 9px;
      background: #f7f7f7;
      color: #202020;
      font-family: 'Atavian', Arial, sans-serif;
      font-size: 9px;
      line-height: 1.1;
      letter-spacing: .04em;
      text-align: center;
      text-transform: uppercase;
      translate: var(--magnet-x, 0px) var(--magnet-y, 0px);
      transition: width 420ms cubic-bezier(.16, 1, .3, 1), padding 420ms cubic-bezier(.16, 1, .3, 1), opacity 260ms ease, translate 560ms cubic-bezier(.22, 1.35, .36, 1), transform 220ms ease, background-color 220ms ease, color 220ms ease, box-shadow 220ms ease;
      will-change: translate;
    }

    .gallery-bottom-nav a span {
      display: inline-block;
      transition: opacity 220ms ease, transform 320ms cubic-bezier(.16, 1, .3, 1);
    }

    .gallery-return-label {
      position: absolute;
      inset: 50% 0 auto;
      opacity: 0;
      transform: translateY(6px);
    }

    .gallery-bottom-nav a.is-selected {
      width: min(120px, 100%);
      padding: 8px 10px;
      background: #202020;
      color: #f7f5f0;
      opacity: .72;
    }

    .gallery-bottom-nav a.is-selected .gallery-start-label {
      opacity: 0;
      transform: translateY(-6px);
    }

    .gallery-bottom-nav a.is-selected .gallery-return-label {
      opacity: 1;
      transform: translateY(-50%);
    }

    .gallery-bottom-nav a:hover,
    .gallery-bottom-nav a:focus-visible {
      background: #214536;
      color: #f7f5f0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
      translate: var(--magnet-x, 0px) calc(var(--magnet-y, 0px) - 3px);
    }

    .gallery-bottom-nav a:focus-visible {
      outline: 2px solid #f7f7f7;
      outline-offset: 3px;
    }

    .gallery-bottom-nav a:active {
      background: #193629;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .22);
      transform: scale(.98);
    }

    .gallery-bottom-nav a.is-magnetized {
      transition: width 420ms cubic-bezier(.16, 1, .3, 1), padding 420ms cubic-bezier(.16, 1, .3, 1), opacity 260ms ease, translate 110ms ease-out, transform 220ms ease, background-color 220ms ease, color 220ms ease, box-shadow 220ms ease;
    }

    .gallery-bottom-nav a.is-selected:hover,
    .gallery-bottom-nav a.is-selected:focus-visible {
      background: #202020;
      color: #f7f5f0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .2);
      opacity: 1;
    }

    .gallery-bottom-nav a.is-photo-locked,
    .gallery-bottom-nav a.is-photo-locked:hover,
    .gallery-bottom-nav a.is-photo-locked:focus-visible {
      background: #090909;
      color: #fff;
      box-shadow: 0 8px 26px rgba(0, 0, 0, .28);
      opacity: 1;
    }

    .cars-section,
    .fanarts-section {
      background: #0d0d0d;
    }

    .cars-section {
      padding-top: clamp(1rem, 4vw, 3rem);
    }

    .fanarts-section {
      padding: clamp(4rem, 8vw, 7rem) 0;
      text-align: center;
    }

    .fanarts-title {
      margin: 0 0 clamp(2rem, 4vw, 3rem);
      color: #f4f1eb;
      font-size: clamp(2.5rem, 5vw, 5rem);
      line-height: .92;
      letter-spacing: -.075em;
      text-transform: uppercase;
    }

    .fanarts-image {
      width: min(100%, 760px);
      max-height: 78svh;
      margin: 0 auto;
      object-fit: contain;
    }

    .closing-atmosphere {
      background: #0d0d0d;
    }

    .gallery-panel {
      position: fixed;
      inset: 0;
      width: 100%;
      max-width: none;
      height: 100%;
      max-height: none;
      margin: 0;
      padding: clamp(4.5rem, 8vh, 6rem) clamp(1rem, 4vw, 3rem) 3rem;
      overflow: auto;
      border: 0;
      background: #0d0d0d;
      color: #f4f1eb;
    }

    .gallery-panel::backdrop {
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(8px);
    }

    .gallery-panel--showcase {
      background: #f2f2f2;
      color: #171717;
    }

    .gallery-panel--showcase::backdrop {
      background: #fff;
      animation: gallery-white-backdrop 1.35s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .gallery-panel--showcase::after {
      position: absolute;
      z-index: 30;
      inset: 0;
      content: "";
      background: #fff;
      pointer-events: none;
      animation: gallery-white-reveal 1.35s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .gallery-panel--showcase .gallery-infinite-grid {
      z-index: 0;
    }

    .gallery-panel--showcase > *:not(.gallery-infinite-grid) {
      position: relative;
      z-index: 1;
    }

    .gallery-panel--showcase .gallery-panel-close {
      position: sticky;
    }

    .gallery-panel--showcase .cars-section,
    .gallery-panel--showcase .fanarts-section {
      background: transparent;
    }

    .gallery-panel--showcase .gallery-mode-label,
    .gallery-panel--showcase .gallery-current-mode,
    .gallery-panel--showcase .gallery-filter,
    .gallery-panel--showcase .fanarts-title {
      color: #171717;
    }

    .gallery-panel--showcase .gallery-filter.is-active {
      color: #171717;
    }

    .gallery-panel--showcase .gallery-show-more {
      border-color: rgba(0,0,0,.3);
      color: #171717;
    }

    .gallery-panel--showcase .gallery-show-more:hover,
    .gallery-panel--showcase .gallery-show-more:focus-visible {
      border-color: #171717;
      background: #171717;
      color: #fff;
    }

    .gallery-panel--showcase .gallery-panel-close {
      border-color: rgba(0,0,0,.24);
      background: rgba(255,255,255,.8);
      color: #171717;
    }

    .gallery-panel--contact[open] {
      animation: gallery-contact-fade 750ms ease-out both;
    }

    @keyframes gallery-white-backdrop {
      0%, 45% { background: #fff; }
      100% { background: rgba(0,0,0,.72); }
    }

    @keyframes gallery-white-reveal {
      0%, 45% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes gallery-contact-fade {
      from {
        opacity: 0;
      }
      to { opacity: 1; }
    }

    .gallery-panel-close {
      position: sticky;
      top: 0;
      z-index: 20;
      display: block;
      margin: 0 0 1.5rem auto;
      padding: 0.65rem 0.85rem;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(13,13,13,0.8);
      color: #f4f1eb;
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .gallery-panel-close:hover,
    .gallery-panel-close:focus-visible {
      border-color: #f4f1eb;
    }

    .gallery-mode-label {
      width: min(100%, 1220px);
      margin: 0 auto 1.2rem;
      padding: 0 clamp(1.2rem, 2vw, 2rem);
      color: rgba(244, 241, 235, 0.7);
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-align: center;
    }

    .gallery-filter-section {
      padding: clamp(4rem, 9vh, 7rem) 0 clamp(2.5rem, 6vh, 4.5rem);
    }

    .gallery-current-mode {
      width: min(100%, 1220px);
      display: block;
      margin: 0 auto;
      padding: 0 clamp(1.2rem, 2vw, 2rem);
      color: #f4f1eb;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(2.5rem, 4.8vw, 5.2rem);
      line-height: .92;
      letter-spacing: -.075em;
      font-weight: 600;
      text-transform: uppercase;
      text-align: center;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .gallery-current-mode .about-title-line {
      display: block;
    }

    .gallery-filter-title-word {
      display: inline-block;
      vertical-align: top;
    }

    .gallery-filter-title-word-inner {
      display: inline-block;
    }

    .gallery-current-mode.is-reveal-ready .gallery-filter-title-word-inner {
      opacity: 0;
      filter: blur(8px);
      transform: translateY(-110%);
    }

    .gallery-current-mode.is-revealed .gallery-filter-title-word-inner {
      animation: gallery-filter-word-reveal 1.1s cubic-bezier(.16, 1, .3, 1) both;
      animation-delay: calc(var(--gallery-filter-word-index, 0) * 90ms);
    }

    @keyframes gallery-filter-word-reveal {
      from {
        opacity: 0;
        filter: blur(8px);
        transform: translateY(-110%);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    .gallery-current-mode.is-changing {
      opacity: 0;
      transform: translateY(12px);
    }

    .gallery-filter-bar {
      width: min(100%, 1220px);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin: clamp(2.5rem, 5vh, 4rem) auto 0;
      padding: 1.2rem clamp(1.2rem, 2vw, 2rem) 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      scroll-margin-top: 110px;
      justify-content: center;
    }

    .gallery-grid {
      scroll-margin-top: 110px;
    }

    .gallery-filter {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2rem;
      padding: 0.2rem 0;
      background: transparent;
      border: none;
      color: rgba(244, 241, 235, 0.62);
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      transition: color 180ms ease;
    }

    .gallery-filter::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -0.35rem;
      height: 1px;
      background: rgba(255,255,255,0.7);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 220ms ease;
    }

    .gallery-filter:hover,
    .gallery-filter:focus-visible {
      color: rgba(255,255,255,0.96);
    }

    .gallery-filter.is-active {
      color: #fff;
    }

    .gallery-filter.is-active::after {
      transform: scaleX(1);
    }

    .gallery-title {
      margin: 0;
    }

    .gallery-grid {
      width: min(100%, 1220px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(1.1rem, 2vw, 2rem);
      margin: 0 auto;
      justify-items: center;
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
      transition: opacity 260ms ease, filter 260ms ease, transform 260ms ease;
    }

    .gallery-grid.is-transitioning {
      opacity: 0.12;
      filter: blur(12px) brightness(0.75);
      transform: scale(0.985);
      transition: opacity 500ms ease 110ms, filter 500ms ease 110ms, transform 500ms ease 110ms;
    }

    .gallery-load-more-wrap {
      display: flex;
      justify-content: center;
      margin: clamp(2.5rem, 5vw, 4rem) 0 clamp(4rem, 8vw, 6rem);
    }

    .gallery-show-more {
      min-height: 3rem;
      padding: 0.85rem 1.4rem;
      border: 1px solid rgba(255,255,255,0.28);
      background: transparent;
      color: #f4f1eb;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 220ms ease, border-color 220ms ease, color 220ms ease;
    }

    .gallery-show-more:hover,
    .gallery-show-more:focus-visible {
      border-color: #f4f1eb;
      background: #f4f1eb;
      color: #171717;
    }

    .closing-atmosphere .site-footer {
      padding-top: 0.9rem;
      padding-bottom: 1rem;
    }

    .gallery-item {
      animation: gallery-item-reveal 800ms cubic-bezier(.16, 1, .3, 1) both;
      animation-delay: calc(var(--gallery-item-index, 0) * 70ms);
    }

    @keyframes gallery-item-reveal {
      from { opacity: 0; translate: 0 28px; }
      to { opacity: 1; translate: 0 0; }
    }

    .gallery-item {
      position: relative;
      display: block;
      overflow: hidden;
      background: #121212;
      border: 1px solid rgba(255,255,255,0.08);
      text-decoration: none;
      transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
      margin: 0;
      padding: 0;
      aspect-ratio: 3 / 4;
    }

    .gallery-item:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.18);
      box-shadow: 0 18px 34px rgba(0,0,0,0.18);
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.08) saturate(.72) brightness(.9) grayscale(.1);
      aspect-ratio: 3 / 4;
      margin: 0;
      border: 0;
      scale: 1.15;
      translate: 0 var(--gallery-parallax-y, 0px);
      transition: translate 120ms linear, scale 700ms cubic-bezier(.16, 1, .3, 1), filter 700ms ease;
    }

    .gallery-item:hover img {
      transform: scale(1.02);
      filter: contrast(1.12) saturate(.8) brightness(.96) grayscale(0);
    }

    .gallery-label {
      position: absolute;
      left: 1rem;
      bottom: 1rem;
      padding: 0.5rem 0.7rem;
      background: rgba(15,15,15,0.7);
      border: 1px solid rgba(255,255,255,0.12);
      color: #f4f1eb;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
      backdrop-filter: blur(10px);
    }

    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .gallery-topbar {
        display: block;
      }

      .gallery-nav {
        margin-top: 1rem;
        flex-wrap: wrap;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-bottom-nav a {
        padding: 12px 14px 11px;
        border: 1px solid rgba(17, 17, 17, 0.12);
        font-size: 9px;
        letter-spacing: .12em;
      }

      .gallery-bottom-nav a.is-selected {
        padding: 8px 10px;
      }

      .gallery-bottom-nav {
        width: min(68vw, 300px);
      }

      .gallery-bottom-nav a:hover,
      .gallery-bottom-nav a:focus-visible {
        translate: var(--magnet-x, 0px) calc(var(--magnet-y, 0px) - 3px);
      }

      .gallery-item,
      .gallery-item img {
        aspect-ratio: 1.05;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gallery-item {
        animation: none;
      }

      .gallery-current-mode.is-reveal-ready .gallery-filter-title-word-inner {
        opacity: 1;
        filter: none;
        transform: none;
      }

      .gallery-current-mode.is-revealed .gallery-filter-title-word-inner {
        animation: none;
      }

      .gallery-item img {
        transform: none;
        scale: none;
        translate: none;
        transition: none;
      }
    }
  </style>
</head>

  <script src="js/main.js"></script>
  <script>
    const galleryHeader = document.querySelector('.site-header');
    const galleryShell = document.querySelector('.gallery-shell');
    const gallerySiteNav = document.querySelector('.site-nav');
    const galleryMenuToggle = document.getElementById('menuToggle');
    const galleryFilterBar = document.getElementById('galleryFilterBar');
    const galleryGrid = document.getElementById('gallery');
    const galleryInfiniteGrid = document.getElementById('galleryInfiniteGrid');
    const galleryInfiniteGridTrack = document.getElementById('galleryInfiniteGridTrack');
    const galleryFocusMeta = document.getElementById('galleryFocusMeta');
    const galleryFocusEvent = galleryFocusMeta?.querySelector('[data-gallery-focus-event]');
    const galleryFocusImage = galleryFocusMeta?.querySelector('[data-gallery-focus-image]');
    const galleryFocusFilename = galleryFocusMeta?.querySelector('[data-gallery-focus-filename]');
    const galleryShowMore = document.getElementById('galleryShowMore');
    const galleryCurrentMode = document.getElementById('galleryCurrentMode');
    const galleryHero = document.querySelector('.gallery-hero');
    const galleryMediaControls = galleryHero?.querySelector('.media-controls');
    const gallerySoundButton = galleryHero?.querySelector('.sound-button');
    const galleryHeroPlayButton = galleryHero?.querySelector('.play-button');
    const galleryNavLink = document.querySelector('[data-scroll-top="true"]');
    const galleryNavAnchors = document.querySelectorAll('a[href="#top"], a[href="#cars"]');
    const galleryStartButton = document.querySelector('.gallery-bottom-nav a[href="#cars"]');
    const galleryPanelCloseButtons = document.querySelectorAll('[data-close-gallery-panel]');
    const setGalleryStartButtonState = (isGalleryOpen) => {
      if (!galleryStartButton) return;
      galleryStartButton.classList.toggle('is-selected', isGalleryOpen);
      galleryStartButton.setAttribute('aria-label', isGalleryOpen ? 'Return to gallery cover' : 'Start gallery');
    };
    let galleryImageRecords = [];
    let galleryActiveFilter = 'all';
    let galleryVisibleRows = 4;
    let galleryRenderedCount = 0;
    let galleryColumnCount = 0;
    let galleryParallaxFrame = null;
    let galleryGridPeriodX = 0;
    let galleryGridPeriodY = 0;
    let galleryGridOffsetX = 0;
    let galleryGridOffsetY = 0;
    let galleryGridZoom = 1;
    let galleryGridDrag = null;
    let galleryFocusedTile = null;
    let galleryPhotoLocked = false;
    let galleryPendingFocusedTile = null;
    let galleryGridInertiaFrame = null;
    let galleryGridCenteringTimeout = null;
    let galleryGridPointerMovedDuringCentering = false;
    let galleryGridLastPointerX = null;
    let galleryGridLastPointerY = null;
    let galleryGridPositionInitialized = false;
    let galleryAnimationPausedByUser = false;
    const galleryGridMinZoom = 0.7;
    const galleryGridMaxZoom = 1.45;
    const galleryGridClickThreshold = 8;
    const galleryGridFocusDistance = 120;
    const galleryPhotoDismissDistance = 36;
    const galleryParallaxImages = new Set();
    const galleryParallaxObserver = !window.matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window
      ? new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            galleryParallaxImages.add(entry.target);
          } else {
            galleryParallaxImages.delete(entry.target);
          }
        });
        scheduleGalleryParallax();
      }, { rootMargin: '100px 0px' })
      : null;

    function updateGalleryHeader() {
      if (!galleryHeader || !galleryShell) return;
      const earlyScrollThreshold = 24;
      galleryHeader.classList.toggle('is-scrolled', window.scrollY > earlyScrollThreshold);
    }

    function setGalleryGridMode(isActive) {
      galleryHero?.classList.toggle('is-grid-background', isActive);
      galleryHero?.classList.toggle('is-animation-paused', galleryAnimationPausedByUser || isActive);
      document.documentElement.classList.toggle('gallery-grid-background', isActive);
      if (!isActive) {
        clearGalleryFocusedTile();
        stopGalleryGridInertia();
        galleryGridDrag = null;
        galleryInfiniteGrid?.classList.remove('is-dragging');
      }
      if (galleryHeader) galleryHeader.inert = isActive;
      if (galleryMediaControls) galleryMediaControls.inert = isActive;
      if (gallerySoundButton) gallerySoundButton.inert = isActive;
      if (gallerySiteNav) {
        if (isActive) gallerySiteNav.classList.remove('is-open');
        gallerySiteNav.inert = isActive;
      }
      if (isActive) galleryMenuToggle?.setAttribute('aria-expanded', 'false');
    }

    function slugify(value) {
      return String(value)
        .toLowerCase()
        .trim()
        .replace(/[_\s]+/g, '-')
        .replace(/[^a-z0-9-]/g, '');
    }

    function getGalleryColumns() {
      if (!galleryGrid) return 1;
      return Math.max(1, window.getComputedStyle(galleryGrid).gridTemplateColumns.trim().split(/\s+/).length);
    }

    function getActiveGalleryImages() {
      return galleryActiveFilter === 'all'
        ? galleryImageRecords
        : galleryImageRecords.filter((record) => record.filter === galleryActiveFilter);
    }

    function normalizeGalleryGridOffset(offset, period) {
      if (period <= 0) return offset;
      const remainder = ((offset % period) + period) % period;
      return remainder === 0 ? -period : remainder - period;
    }

    function getNearestGalleryGridOffset(offset, period, currentOffset, reelIndex, reelCount) {
      if (period <= 0) return { offset, shift: 0 };

      const minimumShift = -reelIndex;
      const maximumShift = reelCount - 1 - reelIndex;
      let nearestShift = minimumShift;
      let nearestDistance = Infinity;
      for (let shift = minimumShift; shift <= maximumShift; shift += 1) {
        const candidateOffset = offset - shift * period;
        const distance = Math.abs(candidateOffset - currentOffset);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestShift = shift;
        }
      }

      return {
        offset: offset - nearestShift * period,
        shift: nearestShift
      };
    }

    function updateGalleryGridPosition(reset = false) {
      const reel = galleryInfiniteGridTrack?.querySelector('.gallery-grid-reel');
      if (!reel) return;

      const nextPeriodX = reel.offsetWidth * galleryGridZoom;
      const nextPeriodY = reel.offsetHeight * galleryGridZoom;
      if (nextPeriodX <= 0 || nextPeriodY <= 0) return;

      galleryGridPeriodX = nextPeriodX;
      galleryGridPeriodY = nextPeriodY;
      if (reset || !galleryGridPositionInitialized) {
        galleryGridOffsetX = -galleryGridPeriodX;
        galleryGridOffsetY = -galleryGridPeriodY;
        galleryGridPositionInitialized = true;
      } else {
        galleryGridOffsetX = normalizeGalleryGridOffset(galleryGridOffsetX, galleryGridPeriodX);
        galleryGridOffsetY = normalizeGalleryGridOffset(galleryGridOffsetY, galleryGridPeriodY);
      }

      applyGalleryGridTransform();
    }

    function applyGalleryGridTransform() {
      if (!galleryInfiniteGridTrack) return;
      galleryInfiniteGridTrack.style.transform = `translate3d(${galleryGridOffsetX}px, ${galleryGridOffsetY}px, 0) scale(${galleryGridZoom})`;
    }

    function rebaseGalleryGridAfterFocus(tile) {
      if (!tile || galleryGridPeriodX <= 0 || galleryGridPeriodY <= 0) return tile;

      const getSafeOffset = (offset, period) => {
        let safeOffset = offset;
        while (safeOffset < -period * 1.5) safeOffset += period;
        while (safeOffset >= -period * 0.5) safeOffset -= period;
        return safeOffset;
      };

      const nextOffsetX = getSafeOffset(galleryGridOffsetX, galleryGridPeriodX);
      const nextOffsetY = getSafeOffset(galleryGridOffsetY, galleryGridPeriodY);
      const columnShift = Math.round((galleryGridOffsetX - nextOffsetX) / galleryGridPeriodX);
      const rowShift = Math.round((galleryGridOffsetY - nextOffsetY) / galleryGridPeriodY);
      if (columnShift === 0 && rowShift === 0) return tile;

      const reel = tile.closest('.gallery-grid-reel');
      const reelRow = Number(reel?.dataset.gridRow);
      const reelColumn = Number(reel?.dataset.gridColumn);
      const rebasedReel = galleryInfiniteGridTrack.querySelector(
        `.gallery-grid-reel[data-grid-row="${reelRow + rowShift}"][data-grid-column="${reelColumn + columnShift}"]`
      );
      const rebasedTile = rebasedReel?.querySelector(
        `.gallery-grid-tile[data-grid-image-index="${tile.dataset.gridImageIndex}"]`
      );
      if (!rebasedTile) return tile;

      if (rebasedTile !== tile) tile.classList.remove('is-focused');
      galleryGridOffsetX = nextOffsetX;
      galleryGridOffsetY = nextOffsetY;
      applyGalleryGridTransform();
      return rebasedTile;
    }

    function setGalleryFocusedTile(tile) {
      if (galleryFocusedTile === tile) return;
      galleryFocusedTile?.classList.remove('is-focused');
      galleryFocusedTile = tile;
      galleryFocusedTile?.classList.add('is-focused');
      galleryInfiniteGrid?.classList.toggle('has-focused-tile', Boolean(tile));
      galleryStartButton?.classList.toggle('is-photo-locked', Boolean(tile) && galleryPhotoLocked);
      galleryStartButton?.setAttribute(
        'aria-label',
        tile ? 'Return to photo grid' : galleryHero?.classList.contains('is-grid-background') ? 'Return to gallery cover' : 'Start gallery'
      );
      galleryFocusMeta?.classList.toggle('is-visible', Boolean(tile));
      galleryFocusMeta?.setAttribute('aria-hidden', String(!tile));
      if (tile) {
        if (galleryFocusEvent) galleryFocusEvent.textContent = tile.dataset.albumTitle || 'Gallery';
        if (galleryFocusImage) {
          galleryFocusImage.textContent = `Frame ${tile.dataset.imageNumber || ''} / ${tile.dataset.imageCount || ''}`;
        }
        if (galleryFocusFilename) galleryFocusFilename.textContent = tile.dataset.imageName || '';
      }
    }

    function finishGalleryGridCentering() {
      if (galleryGridCenteringTimeout !== null) {
        window.clearTimeout(galleryGridCenteringTimeout);
        galleryGridCenteringTimeout = null;
      }
      galleryInfiniteGridTrack?.classList.remove('is-centering');
      if (galleryPendingFocusedTile) {
        const pendingTile = galleryPendingFocusedTile;
        galleryPendingFocusedTile = null;
        setGalleryFocusedTile(rebaseGalleryGridAfterFocus(pendingTile));
      }

      const pointerMoved = galleryGridPointerMovedDuringCentering;
      galleryGridPointerMovedDuringCentering = false;
      if (pointerMoved && galleryGridLastPointerX !== null && galleryGridLastPointerY !== null) {
        updateGalleryFocusedTileDistance(galleryGridLastPointerX, galleryGridLastPointerY);
      }
    }

    function clearGalleryFocusedTile() {
      galleryPhotoLocked = false;
      finishGalleryGridCentering();
      setGalleryFocusedTile(null);
    }

    function updateGalleryFocusedTileDistance(pointerX, pointerY, movementX = 0, movementY = 0) {
      galleryGridLastPointerX = pointerX;
      galleryGridLastPointerY = pointerY;
      if (galleryPhotoLocked) return;
      if (galleryGridCenteringTimeout !== null) {
        if (movementX !== 0 || movementY !== 0) {
          galleryGridPointerMovedDuringCentering = true;
        }
        return;
      }
      if (!galleryFocusedTile) return;
      if (!galleryFocusedTile.isConnected) {
        clearGalleryFocusedTile();
        return;
      }

      const bounds = galleryFocusedTile.getBoundingClientRect();
      const distanceX = Math.max(bounds.left - pointerX, 0, pointerX - bounds.right);
      const distanceY = Math.max(bounds.top - pointerY, 0, pointerY - bounds.bottom);
      if (Math.hypot(distanceX, distanceY) > galleryGridFocusDistance) {
        clearGalleryFocusedTile();
      }
    }

    function focusGalleryTile(tile, pointerX, pointerY) {
      if (!tile) {
        clearGalleryFocusedTile();
        return;
      }
      if (galleryPhotoLocked) return;

      finishGalleryGridCentering();
      galleryPhotoLocked = true;
      const gridBounds = galleryInfiniteGrid.getBoundingClientRect();
      const reel = tile.closest('.gallery-grid-reel');
      const previousZoom = galleryGridZoom;
      const nextZoom = galleryGridMaxZoom;
      const nextPeriodX = (reel?.offsetWidth || 0) * nextZoom;
      const nextPeriodY = (reel?.offsetHeight || 0) * nextZoom;
      galleryGridZoom = nextZoom;
      galleryGridPeriodX = nextPeriodX;
      galleryGridPeriodY = nextPeriodY;
      applyGalleryGridTransform();
      const zoomedTileBounds = tile.getBoundingClientRect();
      const rawOffsetX = galleryGridOffsetX + gridBounds.width * 0.25
        - (zoomedTileBounds.left + zoomedTileBounds.width / 2 - gridBounds.left);
      const rawOffsetY = galleryGridOffsetY + gridBounds.height / 2
        - (zoomedTileBounds.top + zoomedTileBounds.height / 2 - gridBounds.top);
      const reelRow = Number(reel?.dataset.gridRow);
      const reelColumn = Number(reel?.dataset.gridColumn);
      const columnOffset = getNearestGalleryGridOffset(rawOffsetX, nextPeriodX, galleryGridOffsetX, reelColumn, 3);
      const rowOffset = getNearestGalleryGridOffset(rawOffsetY, nextPeriodY, galleryGridOffsetY, reelRow, 3);
      const nextOffsetX = columnOffset.offset;
      const nextOffsetY = rowOffset.offset;
      const columnShift = columnOffset.shift;
      const rowShift = rowOffset.shift;
      const centeredReel = galleryInfiniteGridTrack.querySelector(
        `.gallery-grid-reel[data-grid-row="${reelRow + rowShift}"][data-grid-column="${reelColumn + columnShift}"]`
      );
      const centeredTile = centeredReel?.querySelector(
        `.gallery-grid-tile[data-grid-image-index="${tile.dataset.gridImageIndex}"]`
      );
      if (!centeredTile) {
        galleryPhotoLocked = false;
        galleryGridZoom = previousZoom;
        updateGalleryGridPosition();
        console.error('Gallery could not find a matching centered tile for the selected image.');
        return;
      }
      const shouldAnimate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches
        && (
          Math.abs(nextOffsetX - galleryGridOffsetX) > 0.5
          || Math.abs(nextOffsetY - galleryGridOffsetY) > 0.5
          || Math.abs(nextZoom - previousZoom) > 0.001
        );

      setGalleryFocusedTile(tile);
      galleryGridLastPointerX = pointerX;
      galleryGridLastPointerY = pointerY;
      galleryGridPointerMovedDuringCentering = false;
      if (centeredTile !== tile) {
        centeredTile.classList.add('is-focused');
        galleryPendingFocusedTile = centeredTile;
      }

      galleryGridOffsetX = nextOffsetX;
      galleryGridOffsetY = nextOffsetY;
      if (shouldAnimate) {
        galleryInfiniteGridTrack.classList.add('is-centering');
        applyGalleryGridTransform();
        galleryGridCenteringTimeout = window.setTimeout(finishGalleryGridCentering, 2000);
      } else {
        galleryPendingFocusedTile = null;
        applyGalleryGridTransform();
        setGalleryFocusedTile(rebaseGalleryGridAfterFocus(centeredTile));
      }
    }

    function stopGalleryGridInertia() {
      if (galleryGridInertiaFrame !== null) {
        cancelAnimationFrame(galleryGridInertiaFrame);
        galleryGridInertiaFrame = null;
      }
    }

    function startGalleryGridInertia(velocityX, velocityY) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (Math.hypot(velocityX, velocityY) < 0.06) return;

      stopGalleryGridInertia();
      let previousTime = performance.now();
      const glide = (time) => {
        const elapsed = Math.min(time - previousTime, 32);
        previousTime = time;
        galleryGridOffsetX = normalizeGalleryGridOffset(
          galleryGridOffsetX + velocityX * elapsed,
          galleryGridPeriodX
        );
        galleryGridOffsetY = normalizeGalleryGridOffset(
          galleryGridOffsetY + velocityY * elapsed,
          galleryGridPeriodY
        );
        applyGalleryGridTransform();

        const friction = Math.pow(0.96, elapsed / 16);
        velocityX *= friction;
        velocityY *= friction;
        if (Math.hypot(velocityX, velocityY) < 0.025) {
          galleryGridInertiaFrame = null;
          return;
        }
        galleryGridInertiaFrame = requestAnimationFrame(glide);
      };
      galleryGridInertiaFrame = requestAnimationFrame(glide);
    }

    function endGalleryGridDrag(event) {
      if (!galleryGridDrag || event.pointerId !== galleryGridDrag.pointerId) return;
      const distance = Math.hypot(
        event.clientX - galleryGridDrag.startX,
        event.clientY - galleryGridDrag.startY
      );
      const clickedTile = galleryGridDrag.clickedTile;
      const velocityX = galleryGridDrag.velocityX;
      const velocityY = galleryGridDrag.velocityY;
      galleryGridDrag = null;
      galleryInfiniteGrid?.classList.remove('is-dragging');
      if (event.type === 'pointerup' && distance <= galleryGridClickThreshold) {
        focusGalleryTile(clickedTile, event.clientX, event.clientY);
      } else if (event.type === 'pointerup') {
        startGalleryGridInertia(velocityX, velocityY);
      }
    }

    galleryInfiniteGrid?.addEventListener('pointerdown', (event) => {
      if (!galleryHero?.classList.contains('is-grid-background') || event.button !== 0) return;
      finishGalleryGridCentering();
      stopGalleryGridInertia();
      galleryGridDrag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        offsetX: galleryGridOffsetX,
        offsetY: galleryGridOffsetY,
        lastX: event.clientX,
        lastY: event.clientY,
        lastTime: event.timeStamp,
        velocityX: 0,
        velocityY: 0,
        clickedTile: event.target instanceof Element
          ? event.target.closest('.gallery-grid-tile')
          : null
      };
      galleryInfiniteGrid.setPointerCapture(event.pointerId);
      galleryInfiniteGrid.classList.add('is-dragging');
      event.preventDefault();
    });

    galleryInfiniteGrid?.addEventListener('pointermove', (event) => {
      if (!galleryGridDrag || event.pointerId !== galleryGridDrag.pointerId) return;
      const elapsed = Math.max(1, event.timeStamp - galleryGridDrag.lastTime);
      const deltaX = event.clientX - galleryGridDrag.lastX;
      const deltaY = event.clientY - galleryGridDrag.lastY;
      const sampleVelocityX = Math.max(-1.5, Math.min(1.5, deltaX / elapsed));
      const sampleVelocityY = Math.max(-1.5, Math.min(1.5, deltaY / elapsed));
      galleryGridDrag.velocityX = galleryGridDrag.velocityX * 0.4 + sampleVelocityX * 0.6;
      galleryGridDrag.velocityY = galleryGridDrag.velocityY * 0.4 + sampleVelocityY * 0.6;
      galleryGridDrag.lastX = event.clientX;
      galleryGridDrag.lastY = event.clientY;
      galleryGridDrag.lastTime = event.timeStamp;
      galleryGridOffsetX = normalizeGalleryGridOffset(
        galleryGridDrag.offsetX + event.clientX - galleryGridDrag.startX,
        galleryGridPeriodX
      );
      galleryGridOffsetY = normalizeGalleryGridOffset(
        galleryGridDrag.offsetY + event.clientY - galleryGridDrag.startY,
        galleryGridPeriodY
      );
      applyGalleryGridTransform();
      if (
        galleryPhotoLocked
        && Math.hypot(event.clientX - galleryGridDrag.startX, event.clientY - galleryGridDrag.startY) >= galleryPhotoDismissDistance
      ) {
        clearGalleryFocusedTile();
      } else {
        updateGalleryFocusedTileDistance(event.clientX, event.clientY);
      }
    });

    galleryInfiniteGrid?.addEventListener('pointerup', endGalleryGridDrag);
    galleryInfiniteGrid?.addEventListener('pointercancel', endGalleryGridDrag);
    galleryInfiniteGrid?.addEventListener('lostpointercapture', endGalleryGridDrag);
    galleryInfiniteGridTrack?.addEventListener('transitionend', (event) => {
      if (event.propertyName === 'transform' && galleryGridCenteringTimeout !== null) {
        finishGalleryGridCentering();
      }
    });
    galleryInfiniteGrid?.addEventListener('pointermove', (event) => {
      if (!galleryGridDrag) {
        updateGalleryFocusedTileDistance(event.clientX, event.clientY, event.movementX, event.movementY);
      }
    });
    galleryInfiniteGrid?.addEventListener('pointerleave', (event) => {
      updateGalleryFocusedTileDistance(event.clientX, event.clientY, event.movementX, event.movementY);
    });
    document.addEventListener('pointerdown', (event) => {
      if (galleryFocusedTile && !galleryPhotoLocked && !galleryInfiniteGrid?.contains(event.target)) {
        clearGalleryFocusedTile();
      }
    }, true);
    galleryInfiniteGrid?.addEventListener('wheel', (event) => {
      if (!galleryHero?.classList.contains('is-grid-background')) return;
      event.preventDefault();
      if (galleryPhotoLocked) return;
      finishGalleryGridCentering();
      const wheelDelta = event.deltaMode === WheelEvent.DOM_DELTA_LINE
        ? event.deltaY * 16
        : event.deltaMode === WheelEvent.DOM_DELTA_PAGE
          ? event.deltaY * window.innerHeight
          : event.deltaY;
      const nextZoom = Math.max(
        galleryGridMinZoom,
        Math.min(galleryGridMaxZoom, galleryGridZoom * Math.exp(-wheelDelta * 0.001))
      );
      if (nextZoom === galleryGridZoom) return;

      stopGalleryGridInertia();
      galleryGridDrag = null;
      galleryInfiniteGrid.classList.remove('is-dragging');
      galleryGridOffsetX = event.clientX - ((event.clientX - galleryGridOffsetX) / galleryGridZoom) * nextZoom;
      galleryGridOffsetY = event.clientY - ((event.clientY - galleryGridOffsetY) / galleryGridZoom) * nextZoom;
      galleryGridZoom = nextZoom;
      updateGalleryGridPosition();
    }, { passive: false });

    function renderInfiniteGridTiles() {
      if (!galleryInfiniteGridTrack || galleryImageRecords.length === 0) return;

      const tileCount = 24;
      const selectedImages = Array.from({ length: tileCount }, (_, index) => {
        const recordIndex = galleryImageRecords.length > tileCount
          ? Math.floor(index * galleryImageRecords.length / tileCount)
          : index % galleryImageRecords.length;
        return galleryImageRecords[recordIndex];
      });
      const reels = document.createDocumentFragment();

      for (let row = 0; row < 3; row += 1) {
        for (let column = 0; column < 3; column += 1) {
          const reel = document.createElement('div');
          reel.className = 'gallery-grid-reel';
          reel.dataset.gridRow = String(row);
          reel.dataset.gridColumn = String(column);

          selectedImages.forEach((record, index) => {
            const tile = document.createElement('div');
            tile.className = 'gallery-grid-tile';
            tile.dataset.gridImageIndex = String(index);
            tile.dataset.albumTitle = record.albumTitle;
            tile.dataset.imageNumber = String(record.index + 1);
            tile.dataset.imageCount = String(record.imageCount);
            tile.dataset.imageName = record.imagePath.split('/').pop().replace(/\.[^.]+$/, '');

            const image = document.createElement('img');
            image.src = encodeURI(record.imagePath);
            image.alt = '';
            image.loading = 'lazy';
            image.decoding = 'async';
            image.draggable = false;
            tile.appendChild(image);
            reel.appendChild(tile);
          });

          reels.appendChild(reel);
        }
      }

      galleryInfiniteGridTrack.replaceChildren(reels);
      updateGalleryGridPosition(true);
    }

    function createGalleryItem(record, index) {
      const item = document.createElement('a');
      item.className = 'gallery-item';
      if (record.index % 3 === 1) {
        item.classList.add('gallery-item--tall');
      }
      item.href = '#';
      item.dataset.event = record.filter;
      item.style.setProperty('--gallery-item-index', String(index % (galleryColumnCount * 4)));
      item.setAttribute('aria-label', `${record.albumTitle} image ${record.index + 1}`);
      item.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
      });

      const image = document.createElement('img');
      image.src = encodeURI(record.imagePath);
      image.alt = `AW3RY ${record.albumTitle} automotive photography by Dawid Jagóra, image ${record.index + 1}`;
      image.loading = 'lazy';
      image.decoding = 'async';
      item.appendChild(image);

      const label = document.createElement('span');
      label.className = 'gallery-label';
      label.textContent = String(record.index + 1).padStart(2, '0');
      item.appendChild(label);

      if (galleryParallaxObserver) {
        galleryParallaxObserver.observe(image);
      }

      return item;
    }

    function renderGalleryItems(reset = false) {
      if (!galleryGrid || !galleryShowMore) return;

      if (reset) {
        if (galleryParallaxObserver) {
          galleryGrid.querySelectorAll('.gallery-item img').forEach((image) => {
            galleryParallaxObserver.unobserve(image);
            galleryParallaxImages.delete(image);
          });
        }
        galleryGrid.replaceChildren();
        galleryRenderedCount = 0;
      }

      const activeImages = getActiveGalleryImages();
      const batchSize = galleryColumnCount * 4;
      const nextCount = Math.min(activeImages.length, reset
        ? galleryVisibleRows * galleryColumnCount
        : galleryRenderedCount + batchSize);

      for (let index = galleryRenderedCount; index < nextCount; index += 1) {
        galleryGrid.appendChild(createGalleryItem(activeImages[index], index));
      }

      galleryRenderedCount = nextCount;
      galleryShowMore.hidden = galleryRenderedCount >= activeImages.length;
      scheduleGalleryParallax();
    }

    function scheduleGalleryParallax() {
      if (!galleryParallaxObserver || galleryParallaxFrame !== null) return;

      galleryParallaxFrame = window.requestAnimationFrame(() => {
        galleryParallaxFrame = null;
        const viewportCenter = window.innerHeight / 2;

        galleryParallaxImages.forEach((image) => {
          const bounds = image.parentElement.getBoundingClientRect();
          const distanceFromCenter = (bounds.top + bounds.height / 2 - viewportCenter) / Math.max(1, window.innerHeight);
          const offset = Math.max(-36, Math.min(36, distanceFromCenter * -64));
          image.style.setProperty('--gallery-parallax-y', `${offset.toFixed(2)}px`);
        });
      });
    }

    function applyGalleryFilters() {
      if (!galleryFilterBar) return;

      galleryFilterBar.addEventListener('click', (event) => {
        const button = event.target.closest('.gallery-filter');
        if (!button || !galleryFilterBar.contains(button)) return;

        const selectedFilter = button.dataset.filter;
        const selectedLabel = button.textContent.trim();

        if (galleryCurrentMode) {
          galleryCurrentMode.classList.add('is-changing');

          window.setTimeout(() => {
            galleryCurrentMode.textContent = selectedLabel;
            galleryCurrentMode.classList.remove('is-changing');
          }, 120);
        }

        if (!galleryGrid) return;

        galleryGrid.classList.add('is-transitioning');

        window.setTimeout(() => {
          galleryFilterBar.querySelectorAll('.gallery-filter').forEach((item) => item.classList.toggle('is-active', item === button));
          galleryActiveFilter = selectedFilter;
          galleryVisibleRows = 4;
          renderGalleryItems(true);
          galleryGrid.classList.remove('is-transitioning');
        }, 220);
      });
    }

    async function loadGalleryData() {
      if (window.location.protocol === 'file:' && !window.galleryData) {
        await galleryDataReady;
      }

      const fallbackData = {
        albums: [
          {
            name: 'substance',
            title: 'Substance',
            images: ['gallery/substance/_XM50033.webp', 'gallery/substance/_XM50106.webp', 'gallery/substance/_XM50395.webp']
          },
          {
            name: 'kustom-movement',
            title: 'Kustom Movement',
            images: ['gallery/kustom-movement/_XM50105.webp', 'gallery/kustom-movement/FXM50165.webp', 'gallery/kustom-movement/FXM50233.webp']
          }
        ]
      };

      const preloadedData = typeof window !== 'undefined' && window.galleryData && Array.isArray(window.galleryData.albums)
        ? window.galleryData
        : null;

      let data = preloadedData || fallbackData;

      if (window.location.protocol !== 'file:') {
        try {
          const response = await fetch('/gallery/assets/files/gallery-data.json', { cache: 'no-store' });
          if (response.ok) {
            const json = await response.json();
            if (json && Array.isArray(json.albums)) {
              data = json;
            }
          }
        } catch (error) {
          console.warn('Gallery JSON not found, using fallback gallery data.', error);
        }
      }

      if (!galleryFilterBar || !galleryGrid) return;

      galleryFilterBar.innerHTML = '<button class="gallery-filter is-active" type="button" data-filter="all">All</button>';
      galleryGrid.innerHTML = '';

      const albums = Array.isArray(data.albums) ? data.albums : [];
      galleryImageRecords = [];

      albums.forEach((album) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'gallery-filter';
        button.dataset.filter = slugify(album.name || album.title || 'album');
        button.textContent = album.title || album.name || 'Gallery';
        galleryFilterBar.appendChild(button);

        const albumImages = Array.isArray(album.images) ? album.images : [];
        albumImages.forEach((imagePath, index) => {
          galleryImageRecords.push({
            imagePath,
            index,
            imageCount: albumImages.length,
            filter: button.dataset.filter,
            albumTitle: album.title || album.name || 'Gallery'
          });
        });
      });

      renderInfiniteGridTiles();

      if (!albums.some((album) => slugify(album.name || album.title || 'album') === 'bring-the-nine')) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'gallery-filter';
        button.dataset.filter = 'bring-the-nine';
        button.textContent = 'Bring The Nine';
        galleryFilterBar.appendChild(button);
      }

      applyGalleryFilters();
      galleryColumnCount = getGalleryColumns();
      renderGalleryItems(true);
      if (galleryShowMore) {
        galleryShowMore.addEventListener('click', () => {
          galleryVisibleRows += 4;
          renderGalleryItems();
        });
      }
    }

    if (galleryNavLink) {
      galleryNavLink.addEventListener('click', (event) => {
        event.preventDefault();
        document.querySelectorAll('.gallery-panel[open]').forEach((panel) => panel.close());
        setGalleryGridMode(false);
        galleryHero?.classList.remove('is-cars-palette', 'is-fanarts-palette');
        setGalleryStartButtonState(false);
      });
    }

    galleryPanelCloseButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const panel = button.closest('dialog');
        if (panel && panel.open) panel.close();
      });
    });

    document.querySelectorAll('.gallery-panel').forEach((panel) => {
      panel.addEventListener('cancel', (event) => {
        event.preventDefault();
        panel.close();
      });
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      const openPanel = document.querySelector('.gallery-panel[open]');
      if (!openPanel) return;
      event.preventDefault();
      openPanel.close();
    });

    galleryNavAnchors.forEach((anchor) => {
      anchor.addEventListener('click', (event) => {
        const targetId = anchor.getAttribute('href');
        if (!targetId || !targetId.startsWith('#')) return;
        const target = document.querySelector(targetId);
        if (!target) return;

        event.preventDefault();

        if (targetId === '#top') {
          document.querySelectorAll('.gallery-panel[open]').forEach((panel) => panel.close());
          setGalleryGridMode(false);
          galleryHero?.classList.remove('is-cars-palette', 'is-fanarts-palette');
          setGalleryStartButtonState(false);
          return;
        }

        if (targetId === '#cars') {
          if (galleryPhotoLocked) {
            clearGalleryFocusedTile();
            return;
          }
          if (galleryHero?.classList.contains('is-grid-background') && anchor.classList.contains('is-selected')) {
            setGalleryGridMode(false);
            galleryHero.classList.remove('is-cars-palette', 'is-fanarts-palette');
            setGalleryStartButtonState(false);
            return;
          }
          setGalleryGridMode(true);
          galleryHero?.classList.remove('is-cars-palette', 'is-fanarts-palette');
          galleryHero?.classList.add('is-cars-palette');
          setGalleryStartButtonState(true);
          return;
        }

        if (target instanceof HTMLDialogElement && !target.open) target.showModal();
      });
    });

    if (galleryHero && galleryHeroPlayButton) {
      const setGalleryAnimationPaused = (isPaused) => {
        galleryAnimationPausedByUser = isPaused;
        galleryHero.classList.toggle(
          'is-animation-paused',
          galleryAnimationPausedByUser || galleryHero.classList.contains('is-grid-background')
        );
        galleryHeroPlayButton.setAttribute('aria-pressed', String(isPaused));
        galleryHeroPlayButton.setAttribute('aria-label', isPaused ? 'Play animation' : 'Pause animation');
      };

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const effectsDisabled = document.documentElement.classList.contains('vfx-disabled');
      setGalleryAnimationPaused(prefersReducedMotion || effectsDisabled);
      galleryHeroPlayButton.addEventListener('click', () => {
        setGalleryAnimationPaused(!galleryHero.classList.contains('is-animation-paused'));
      });
    }

    window.addEventListener('scroll', () => {
      updateGalleryHeader();
      scheduleGalleryParallax();
    }, { passive: true });
    window.addEventListener('resize', () => {
      const nextColumnCount = getGalleryColumns();
      if (nextColumnCount !== galleryColumnCount) {
        galleryColumnCount = nextColumnCount;
        renderGalleryItems(true);
      }
      updateGalleryGridPosition();
      scheduleGalleryParallax();
    }, { passive: true });
    updateGalleryHeader();
    loadGalleryData();
  </script>
  <script src="js/hero-flow.js"></script>
</body>
</html>
